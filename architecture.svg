<text x="652" y="195" font-weight="bold">Credit-History Agent</text><text x="652" y="215" font-size="11">lookup_prior_records</text><text x="652" y="230" font-size="11">flag_red_flags</text></g>
<g stroke="#444" fill="none" marker-end="url(#a)"><path d="M320 110 L102 168"/><path d="M350 110 L282 168"/><path d="M410 110 L467 168"/><path d="M440 110 L652 168"/></g>
<text x="380" y="150" text-anchor="middle" font-size="12" fill="#555">delegates in order 1 to 4</text>
<rect x="20" y="290" width="715" height="50" rx="8" fill="#e8eefc" stroke="#349"/><text x="377" y="312" text-anchor="middle" font-weight="bold">Shared ApplicantRecord (memory) - every agent reads and writes</text><text x="377" y="330" text-anchor="middle" font-size="12">fields, emi, ratio, credit flags, decision, trace</text>
<rect x="20" y="365" width="340" height="44" rx="8" fill="#f3f3f3" stroke="#666"/><text x="190" y="392" text-anchor="middle">prior_records.json (credit memory store)</text>
<rect x="395" y="365" width="340" height="44" rx="8" fill="#f3f3f3" stroke="#666"/><text x="565" y="392" text-anchor="middle">run_log.jsonl (append-only)</text>
<path d="M400 230 L400 288" stroke="#444" marker-end="url(#a)"/>
<text x="380" y="440" text-anchor="middle" font-size="12" fill="#a00">HALT: income missing -&gt; REFER (never assumed)</text>
