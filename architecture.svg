<svg viewBox="0 0 760 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial,sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="760" height="600" fill="#fff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker></defs>
<text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold">Loan Underwriting - Manager-Worker Delegation + Bank Advisory</text>
<rect x="30" y="50" width="160" height="44" rx="8" fill="#eef" stroke="#446"/><text x="110" y="77" text-anchor="middle">Application text</text>
<rect x="260" y="48" width="240" height="68" rx="8" fill="#ffe9b3" stroke="#a70"/><text x="380" y="72" text-anchor="middle" font-weight="bold">Underwriting Manager</text><text x="380" y="92" text-anchor="middle" font-size="11">decide_rule | format_justification</text><text x="380" y="107" text-anchor="middle" font-size="11">remember_decision</text>
<line x1="190" y1="72" x2="258" y2="72" stroke="#444" marker-end="url(#a)"/>
<g fill="#dff3e3" stroke="#262"><rect x="20" y="175" width="165" height="70" rx="8"/><rect x="200" y="175" width="165" height="70" rx="8"/><rect x="385" y="175" width="165" height="70" rx="8"/><rect x="570" y="175" width="165" height="70" rx="8"/></g>
<g text-anchor="middle"><text x="102" y="198" font-weight="bold">Document Agent</text><text x="102" y="217" font-size="11">extract_fields</text><text x="102" y="232" font-size="11">validate_income_present</text>
<text x="282" y="198" font-weight="bold">EMI Agent</text><text x="282" y="217" font-size="11">compute_emi</text><text x="282" y="232" font-size="11">total_interest</text>
<text x="467" y="198" font-weight="bold">Affordability Agent</text><text x="467" y="217" font-size="11">emi_to_income_ratio</text><text x="467" y="232" font-size="11">affordability_verdict</text>
<text x="652" y="198" font-weight="bold">Credit-History Agent</text><text x="652" y="217" font-size="11">lookup_prior_records</text><text x="652" y="232" font-size="11">flag_red_flags</text></g>
<g stroke="#444" fill="none" marker-end="url(#a)"><path d="M320 116 L102 173"/><path d="M350 116 L282 173"/><path d="M410 116 L467 173"/><path d="M440 116 L652 173"/></g>
<text x="380" y="150" text-anchor="middle" font-size="12" fill="#555">1. delegates in order</text>
<path d="M377 245 L377 292" stroke="#444" marker-end="url(#a)"/>
<text x="390" y="274" font-size="12" fill="#555">2. then advisory stage (bank comparison)</text>
<g fill="#fde8d4" stroke="#a60"><rect x="20" y="295" width="165" height="74" rx="8"/><rect x="200" y="295" width="165" height="74" rx="8"/><rect x="385" y="295" width="165" height="74" rx="8"/><rect x="570" y="295" width="165" height="74" rx="8"/></g>
<g text-anchor="middle"><text x="102" y="318" font-weight="bold">Eligibility Agent</text><text x="102" y="337" font-size="11">list_banks, credit_band</text><text x="102" y="352" font-size="11">check_eligibility</text>
<text x="282" y="318" font-weight="bold">Comparison Agent</text><text x="282" y="337" font-size="11">price_option</text><text x="282" y="352" font-size="11">rank_options</text>
<text x="467" y="318" font-weight="bold">Advisor Agent</text><text x="467" y="337" font-size="11">loan_type_advice</text><text x="467" y="352" font-size="11">build_advisory</text>
<text x="652" y="318" font-weight="bold">Counter-Offer Agent</text><text x="652" y="337" font-size="11">max_affordable_amount</text><text x="652" y="352" font-size="11">min_tenure_months</text></g>
<path d="M377 369 L377 410" stroke="#444" marker-end="url(#a)"/>
<rect x="20" y="412" width="715" height="54" rx="8" fill="#e8eefc" stroke="#349"/><text x="377" y="435" text-anchor="middle" font-weight="bold">Shared ApplicantRecord (short-term memory) - every agent reads and writes</text><text x="377" y="454" text-anchor="middle" font-size="12">fields, emi, ratio, credit flags, bank options, advisory, decision, trace</text>
<rect x="20" y="495" width="350" height="46" rx="8" fill="#f3f3f3" stroke="#666"/><text x="195" y="515" text-anchor="middle">memory.db (long-term memory, SQLite)</text><text x="195" y="531" text-anchor="middle" font-size="11">past decisions, recalled for returning applicants</text>
<rect x="385" y="495" width="350" height="46" rx="8" fill="#f3f3f3" stroke="#666"/><text x="560" y="515" text-anchor="middle">run_log.jsonl (append-only)</text><text x="560" y="531" text-anchor="middle" font-size="11">every agent event, never edited</text>
<text x="380" y="566" text-anchor="middle" font-size="12" fill="#a00">HALT: income missing -&gt; REFER (never assumed)</text>
<text x="380" y="586" text-anchor="middle" font-size="11" fill="#555">Bank catalog (data/banks.json) = illustrative sample data, fictional banks, not live rates</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
